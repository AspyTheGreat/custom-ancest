<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nat 1 Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f0f0ff;
  background: linear-gradient(135deg, #14002b, #020024);
}

/* ================= HOME ================= */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  background: radial-gradient(circle at 30% 30%, #2a1a4a, #0b0b0f),
              linear-gradient(120deg, #1a0033, #000814);
  background-blend-mode: screen;
}

h1 {
  font-size: 6rem;
  margin: 0;
  letter-spacing: 6px;
  color: #d6c6ff;
}

.coming-soon {
  margin-top: 10px;
  font-size: 1rem;
  opacity: 0.7;
  letter-spacing: 2px;
}

/* TILES */
.tile-container {
  margin-top: 40px;
  display: flex;
  gap: 20px;
}

.tile {
  padding: 16px 28px;
  border: 1px solid #6a5acd;
  background: rgba(106, 90, 205, 0.15);
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.tile:hover {
  background: #6a5acd;
  color: #0b0b0f;
}

/* ================= WORLDS PAGE ================= */
.page {
  display: none;
  min-height: 100vh;
  padding: 40px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 180px);
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

.world-card {
  width: 180px;
  height: 120px;
  display: flex;
  justify-content: center;
  align-items: center;

  background: rgba(106, 90, 205, 0.2);
  border: 1px solid #6a5acd;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.world-card:hover {
  background: #6a5acd;
  color: #0b0b0f;
}

/* ================= WORLD DETAIL ================= */
.detail {
  display: none;
  min-height: 100vh;
  padding: 40px;
  text-align: center;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 20px;
}

.tab {
  padding: 10px 18px;
  border: 1px solid #6a5acd;
  border-radius: 6px;
  cursor: pointer;
}

.back {
  margin-top: 40px;
  display: inline-block;
  padding: 10px 20px;
  border: 1px solid #888;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->
<div id="home" class="hero">
  <h1>NAT 1</h1>
  <div class="coming-soon">COMING SOON</div>

  <div class="tile-container">
    <div class="tile" onclick="showWorlds()">WORLDS</div>
    <div class="tile">CHRONICLES</div>
  </div>
</div>

<!-- ================= WORLDS LIST ================= -->
<div id="worlds" class="page">
  <h2>WORLDS</h2>

  <div class="grid">
    <div class="world-card" onclick="openWorld('Tolivric')">Tolivric</div>
    <div class="world-card" onclick="openWorld('Infinitum')">Infinitum</div>
    <div class="world-card" onclick="openWorld('Epalux')">Epalux</div>
    <div class="world-card" onclick="openWorld('Convulux')">The Convulux</div>
    <div class="world-card" onclick="openWorld('Midgard')">Midgard / Ravenfall</div>
  </div>

  <div class="back" onclick="showHome()">← Back</div>
</div>

<!-- ================= WORLD DETAIL ================= -->
<div id="worldDetail" class="detail">
  <h2 id="worldTitle">WORLD</h2>

  <div class="tabs">
    <div class="tab">Lore</div>
    <div class="tab">Characters</div>
    <div class="tab">Combats</div>
    <div class="tab">Timeline</div>
  </div>

  <div class="back" onclick="backToWorlds()">← Back</div>
</div>

<script>
function showWorlds() {
  document.getElementById("home").style.display = "none";
  document.getElementById("worlds").style.display = "block";
}

function showHome() {
  document.getElementById("worlds").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

function openWorld(name) {
  document.getElementById("worlds").style.display = "none";
  document.getElementById("worldDetail").style.display = "block";
  document.getElementById("worldTitle").innerText = name.toUpperCase();
}

function backToWorlds() {
  document.getElementById("worldDetail").style.display = "none";
  document.getElementById("worlds").style.display = "block";
}
</script>

</body>
</html>
