<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/forgore" rel="stylesheet">
<link rel="stylesheet" href="../../css/main_styles.css">

<style>

/* ================= HEADER ================= */
.campaign-header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px 0;
}

.campaign-title {
  font-size: 2.5rem;
  letter-spacing: 3px;
}

.back {
  position: absolute;
  left: 20px;
  cursor: pointer;
  padding: 8px 14px;
  border: 1px solid #888;
  border-radius: 6px;
}

/* ================= IMAGE ================= */
.campaign-image {
  width: 120%;
  max-width: 1200px;
  height: 600px;
  margin: 20px auto;
  border: 1px solid #6a5acd;
  border-radius: 10px;
  background: rgba(106, 90, 205, 0.1);

  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.campaign-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ================= MAIN SPLIT ================= */
.campaign-body {
  display: grid;
  grid-template-columns: 20% 80%;
  width: 90%;
  max-width: 1200px;
  margin: 30px auto;
  gap: 20px;
}

/* LEFT SIDE */
.side-panel {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.side-tile {
  padding: 14px;
  border: 1px solid #6a5acd;
  border-radius: 8px;
  background: rgba(106, 90, 205, 0.15);
  cursor: pointer;
  text-align: center;
  transition: 0.2s;
}

.side-tile:hover {
  background: #6a5acd;
  color: #0b0b0f;
}

/* RIGHT SIDE */
.content-panel {
  border: 1px solid #6a5acd;
  border-radius: 10px;
  padding: 20px;
  background: rgba(106, 90, 205, 0.1);
  min-height: 900px;
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="campaign-header">
  <div class="back" onclick="window.history.back()">← Back</div>
  <div class="campaign-title">ASCENSION OF VECNA 2: THE RITES OF APOTHEOSIS</div>
</div>

<!-- ================= IMAGE ================= -->
<div class="campaign-image">
  <img src="../../assets/sample.jpg" alt="Campaign Image">
</div>

<!-- ================= BODY ================= -->
<div class="campaign-body">

  <!-- LEFT (30%) -->
  <div class="side-panel">
    <div class="side-tile" onclick="loadSection('synopsis')">Campaign Synopsis</div>
    <div class="side-tile" onclick="loadSection('characters')">Characters</div>
    <div class="side-tile" onclick="loadSection('npcs')">NPC's Encountered</div>
    <div class="side-tile" onclick="loadSection('discoveries')">Discoveries</div>
    <div class="side-tile" onclick="loadSection('notes')">Player Notes</div>
    <img src="../../assets/combat icon.webp" class="battle-tile" onclick="goToBattle()">
  </div>

  <!-- RIGHT (70%) -->
  <div class="content-panel" id="content-panel">
    <div id="characters-container"></div>
  </div>

</div>

<script>
function goToBattle() {
  window.location.href = "../../chronicles/Chronicles_previous_battles.html#battles/the-second-blood-war";
}
</script>
