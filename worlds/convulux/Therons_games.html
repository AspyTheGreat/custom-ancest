<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/forgore" rel="stylesheet">
<link rel="stylesheet" href="../../css/main_styles.css">

<style>

/* ================= HEADER ================= */
.campaign-header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px 0;
}

.campaign-title {
  font-size: 2.5rem;
  letter-spacing: 3px;
}

.back {
  position: absolute;
  left: 20px;
  cursor: pointer;
  padding: 8px 14px;
  border: 1px solid #888;
  border-radius: 6px;
}

/* ================= IMAGE ================= */
.campaign-image {
  width: 120%;
  max-width: 1200px;
  height: 600px;
  margin: 20px auto;
  border: 1px solid #6a5acd;
  border-radius: 10px;
  background: rgba(106, 90, 205, 0.1);

  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.campaign-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ================= MAIN SPLIT ================= */
.campaign-body {
  display: grid;
  grid-template-columns: 20% 80%;
  width: 90%;
  max-width: 1200px;
  margin: 30px auto;
  gap: 20px;
}

/* LEFT SIDE */
.side-panel {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.side-tile {
  padding: 14px;
  border: 1px solid #6a5acd;
  border-radius: 8px;
  background: rgba(106, 90, 205, 0.15);
  cursor: pointer;
  text-align: center;
  transition: 0.2s;
}

.side-tile:hover {
  background: #6a5acd;
  color: #0b0b0f;
}

/* RIGHT SIDE */
.content-panel {
  border: 1px solid #6a5acd;
  border-radius: 10px;
  padding: 20px;
  background: rgba(106, 90, 205, 0.1);
  min-height: 900px;
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="campaign-header">
  <div class="back" onclick="window.history.back()">← Back</div>
  <div class="campaign-title">THERON'S GAMES</div>
</div>

<!-- ================= IMAGE ================= -->
<div class="campaign-image">
  <img src="../../assets/sample.jpg" alt="Campaign Image">
</div>

<!-- ================= BODY ================= -->
<div class="campaign-body">

  <!-- LEFT (30%) -->
  <div class="side-panel">
    <div class="side-tile" onclick="loadSection('synopsis')">Campaign Synopsis</div>
    <div class="side-tile" onclick="loadSection('characters')">Characters</div>
    <div class="side-tile" onclick="loadSection('npcs')">NPC's Encountered</div>
    <div class="side-tile" onclick="loadSection('discoveries')">Discoveries</div>
    <div class="side-tile" onclick="loadSection('notes')">Player Notes</div>
    <img src="../../assets/combat icon.webp" class="battle-tile" onclick="goToBattle()">
  </div>

  <!-- RIGHT (70%) -->
  <div class="content-panel" id="content-panel">
    <div id="characters-container"></div>
  </div>

</div>

<script>
function goToBattle() {
  alert("Battle mode coming soon!");
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
<script src="../../js/parser.js"></script>
<script src="../../js/renderer.js"></script>
<script src="../../Shared/campaign-utils.js"></script>
<script>
const files = [
  "../../Character Sheets/Convulux/Theron's Games/Ballard Howler.json",
  "../../Character Sheets/Convulux/Theron's Games/Daiko Sud.json",
  "../../Character Sheets/Convulux/Theron's Games/Mournful Martin.json",
  "../../Character Sheets/Convulux/Theron's Games/Sissava Kreness (Shisuca Morelli).json"
];

const characterImages = {
  "Ballard Howler": "../../assets/Character_images/Theron's_Games/Ballard.webp",
  "Daiko Sud": "../../assets/Character_images/Theron's_Games/Daiko.webp",
  "Mournful Martin": "../../assets/Character_images/Theron's_Games/Martin.webp",
  "Sissava Kreness (Shisuca Morelli)": "../../assets/Character_images/Theron's_Games/Sissava.webp"
};

const campaignData = {
  synopsis: `<h2>Campaign Synopsis</h2><p>Campaign synopsis coming soon.</p>`,
  characters: `<h2>Characters</h2><div id="characters-container"></div>`,
  npcs: `<h2>NPCs Encountered</h2><p>NPC data coming soon.</p>`,
  discoveries: `<h2>Discoveries</h2><p>Discoveries coming soon.</p>`,
  notes: `<h2>Player Notes</h2><p>Player notes coming soon.</p>`
};
</script>
</body>
</html>
