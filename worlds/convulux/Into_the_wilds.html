<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Campaign Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/forgore" rel="stylesheet">
<link rel="stylesheet" href="../../css/main_styles.css">

<style>

/* ================= HEADER ================= */
.campaign-header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px 0;
}

.campaign-title {
  font-size: 2.5rem;
  letter-spacing: 3px;
}

.back {
  position: absolute;
  left: 20px;
  cursor: pointer;
  padding: 8px 14px;
  border: 1px solid #888;
  border-radius: 6px;
}

/* ================= IMAGE ================= */
.campaign-image {
  width: 100%;
  max-width: 1200px;
  height: 600px;
  margin: 20px auto;
  border: 1px solid #6a5acd;
  border-radius: 10px;
  background: rgba(106, 90, 205, 0.1);
  overflow: hidden;
  position: relative;
}

.campaign-image img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* or contain (see below) */
  display: block;
}

/* ================= MAIN SPLIT ================= */
.campaign-body {
  display: grid;
  grid-template-columns: 20% 80%;
  width: 90%;
  max-width: 1200px;
  margin: 30px auto;
  gap: 20px;
}

/* LEFT SIDE */
.side-panel {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.side-tile {
  padding: 14px;
  border: 1px solid #6a5acd;
  border-radius: 8px;
  background: rgba(106, 90, 205, 0.15);
  cursor: pointer;
  text-align: center;
  transition: 0.2s;
}

.side-tile:hover {
  background: #6a5acd;
  color: #0b0b0f;
}

/* RIGHT SIDE */
.content-panel {
  border: 1px solid #6a5acd;
  border-radius: 10px;
  padding: 20px;
  background: rgba(106, 90, 205, 0.1);
  min-height: 900px;
}

.character-img {
  width: 100%;
  max-height: 800px;
  object-fit: contain;
  display: block;
  border-radius: 8px;
}
/*     SHEETS MOVEMENT     */
.sheet-carousel {
  position: relative;
  width: 100%;
  height: 800px;
  overflow: hidden;
  border-radius: 8px;
}

.sheet {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.4s ease;
}

.sheet.active {
  opacity: 1;
}

.sheet img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.sheet-controls {
  margin-top: 10px;
  display: flex;
  justify-content: space-between;
}

.sheet-controls button {
  padding: 8px 14px;
  border: 1px solid #6a5acd;
  background: transparent;
  color: white;
  cursor: pointer;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="campaign-header">
  <div class="back" onclick="window.history.back()">← Back</div>
  <div class="campaign-title">INTO THE WILDS</div>
</div>

<!-- ================= IMAGE ================= -->
<div class="campaign-image">
  <img src="../../assets/Intothewilds.jpg" alt="Campaign Image">
</div>

<!-- ================= BODY ================= -->
<div class="campaign-body">

  <!-- LEFT (30%) -->
  <div class="side-panel">
  <div class="side-tile" onclick="loadSection('synopsis')">Campaign Synopsis</div>
  <div class="side-tile" onclick="loadSection('characterSheet')">Character Sheet</div>
  <div class="side-tile" onclick="loadSection('npcs')">NPC's Encountered</div>
  <div class="side-tile" onclick="loadSection('discoveries')">Discoveries</div>
  <div class="side-tile" onclick="loadSection('notes')">Player Notes</div>
</div>

  <!-- RIGHT (70%) -->
  <div class="content-panel" id="content-panel">
    <p>Content will go here.</p>
  </div>

</div>

<script>
const campaignData = {
  synopsis: `
    <h2>Campaign Synopsis</h2>
    <p>This is a cursed expedition into the wilds where reality begins to break down.</p>
  `,
  characterSheet: `
  <h2>Character Sheets</h2>

  <div class="sheet-carousel">

    <div class="sheet active">
      <img src="../../assets/Rahman.jpg">
    </div>

    <div class="sheet">
      <img src="../../assets/Grux.jpg">
    </div>

    <div class="sheet">
      <img src="../../assets/Hollowgrave.jpg">
    </div>

    <div class="sheet">
      <img src="../../assets/Midlir.jpg">
    </div>

    <div class="sheet">
      <img src="../../assets/Renny.jpg">
    </div>

    <div class="sheet">
      <img src="../../assets/Shi.jpg">
    </div>

    <div class="sheet">
      <img src="../../assets/Yisheng.jpg">
    </div>

  </div>

  <div class="sheet-controls">
    <button onclick="changeSheet(-1)">←</button>
    <button onclick="changeSheet(1)">→</button>
  </div>
`,
  npcs: `
    <h2>NPCs Encountered</h2>
    <p>A dying ranger, a broken oracle, and something that pretends to be human.</p>
  `,
  discoveries: `
    <h2>Discoveries</h2>
    <p>Ancient ruins, corrupted flora, and signs of a buried arcane engine.</p>
  `,
  notes: `
    <h2>Player Notes</h2>
    <p>Everything is getting stranger the deeper they go.</p>
  `
};
</script>

<script>
function loadSection(section) {
  const panel = document.getElementById("content-panel");

  if (campaignData[section]) {
    panel.innerHTML = campaignData[section];
  } else {
    panel.innerHTML = "<p>Section not found.</p>";
  }
}

let currentSheetIndex = 0;

function updateSheets() {
  const sheets = document.querySelectorAll(".sheet");

  sheets.forEach((s, i) => {
    s.classList.toggle("active", i === currentSheetIndex);
  });
}

function changeSheet(direction) {
  const sheets = document.querySelectorAll(".sheet");

  currentSheetIndex += direction;

  if (currentSheetIndex < 0) {
    currentSheetIndex = sheets.length - 1;
  }

  if (currentSheetIndex >= sheets.length) {
    currentSheetIndex = 0;
  }

  updateSheets();
}

</script>

</body>
</html>
